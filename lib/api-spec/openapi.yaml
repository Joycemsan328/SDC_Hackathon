openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: business
    description: Business operations
paths:
  /business/revisions/generate:
    post:
      operationId: generateBusinessCustomerRevision
      tags: [business]
      summary: Generate the queued Customer revision for Business review
      security:
        - businessBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessRevisionRequest"
      responses:
        "200":
          description: Revision pair saved for Business review; proposal content is not returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessRevisionResult"
        "400":
          description: Invalid saved Customer response ID
        "401":
          description: A valid authenticated Business session is required
        "403":
          description: Only approved Business staff may start revision generation
        "409":
          description: Revision already running, failed, or cannot be safely resumed
        "422":
          description: Saved request or change feedback cannot be used safely
        "429":
          description: Shared finite AI generation budget is exhausted
        "503":
          description: Migration, quota, Supabase, or RunPod is unavailable
  /proposals/generate-persisted:
    post:
      operationId: generatePersistedProposalPair
      summary: Generate the queued revision for Business review; never return unreleased content
      security:
        - customerBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersistedProposalRequest"
      responses:
        "200":
          description: Saved workflow metadata only; drafts are private to Business
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessFirstGenerationResult"
        "400":
          description: Invalid saved request ID
        "401":
          description: Sign in with an approved customer account
        "403":
          description: Customer access denied
        "404":
          description: Owned request not found
        "409":
          description: Generation is already in progress
        "503":
          description: Migration, persistence, Supabase, or RunPod is unavailable; request remains saved
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  securitySchemes:
    customerBearer:
      type: http
      scheme: bearer
    businessBearer:
      type: http
      scheme: bearer
  schemas:
    BusinessFirstGenerationResult:
      type: object
      additionalProperties: false
      required: [requestId, revision, persistence, workflowState]
      properties:
        requestId:
          type: string
          format: uuid
        revision:
          type: integer
          minimum: 1
        persistence:
          type: string
          enum: [created, existing]
        workflowState:
          type: string
          enum: [business_review, released, selected, confirmed, changes_requested]
    PersistedProposalRequest:
      type: object
      additionalProperties: false
      required: [requestId]
      properties:
        requestId:
          type: string
          format: uuid
    BusinessRevisionRequest:
      type: object
      additionalProperties: false
      required: [responseId]
      properties:
        responseId:
          type: string
          format: uuid
    BusinessRevisionResult:
      type: object
      additionalProperties: false
      required: [requestId, revision, persistence, workflowState]
      properties:
        requestId:
          type: string
          format: uuid
        revision:
          type: string
          pattern: "^[1-9][0-9]{0,31}$"
        persistence:
          type: string
          enum: [created, existing]
        workflowState:
          type: string
          enum: [business_review]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

