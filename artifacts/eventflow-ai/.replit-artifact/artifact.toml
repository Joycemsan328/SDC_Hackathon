kind = "web"
previewPath = "/"
title = "EventFlow AI"
description = "Unified EventFlow Customer and Business website with shared Supabase login and a same-origin Express API."
version = "1.0.0"
id = "artifacts/eventflow-ai"
router = "path"

[[services]]
name = "web"
paths = ["/"]
localPort = 19894

[services.development]
run = "pnpm -w run preview:production"

[services.production]
build = ["pnpm", "-w", "run", "build:production"]

[services.production.run]
args = ["pnpm", "-w", "run", "start:production"]

[services.production.run.env]
NODE_ENV = "production"

[services.production.health.startup]
path = "/api/healthz"

[services.env]
PORT = "19894"
BASE_PATH = "/"
